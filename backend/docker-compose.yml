services:
  postgres:
    image: postgres:16-alpine
    container_name: entrance_ug_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: entrance_user
      POSTGRES_PASSWORD: entrance_pass
      POSTGRES_DB: entrance_ug
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrance_user -d entrance_ug"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
